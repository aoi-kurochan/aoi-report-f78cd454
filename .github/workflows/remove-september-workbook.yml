name: Remove September workbook history
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remove:
    if: github.repository == 'aoi-kurochan/aoi-report-f78cd454' && github.actor == 'aoi-kurochan' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Verify scope, rewrite and preserve current content
        shell: bash
        env:
          FILTER_BRANCH_SQUELCH_WARNING: '1'
        run: |
          set -euo pipefail
          target='downloads/aoi-royalties-2026-09.xlsx'
          base='29c96a30e8fd89d56083ce16261a5927331ddc27'
          workflow='.github/workflows/remove-september-workbook.yml'
          old=$(git rev-parse HEAD)
          before=$(git rev-parse 'HEAD^{tree}')
          test "$(git branch -r | sed 's/^ *//' | grep -v '^origin/HEAD' | sort)" = 'origin/main'
          test -z "$(git tag --list)"
          git merge-base --is-ancestor "$base" HEAD
          test "$(git diff --name-only "$base" HEAD)" = "$workflow"
          test -z "$(git ls-tree -r HEAD -- "$target")"
          test -n "$(git log --format=%H main -- "$target")"
          git filter-branch --force --index-filter 'git rm --cached --ignore-unmatch -- downloads/aoi-royalties-2026-09.xlsx' -- main
          test "$(git rev-parse 'main^{tree}')" = "$before"
          for commit in $(git rev-list main); do
            test -z "$(git ls-tree -r "$commit" -- "$target")"
          done
          git diff --exit-code "$old" main
          git push --force-with-lease="refs/heads/main:$old" origin main:main
          echo 'MAIN_HISTORY_CLEAN_CURRENT_CONTENT_IDENTICAL'
