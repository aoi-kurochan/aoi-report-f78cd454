<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">ClaudeとCodexへ同じ情報を引き継ぐMDファイル構造</title>
  <desc id="desc">ClaudeとCodexが、共通のAOIフォルダと今回の制作フォルダを読み、文体、判断、原稿の現在地を引き継ぐ構造を示す図</desc>
  <rect width="1200" height="820" fill="#ffffff"/>

  <text x="60" y="70" fill="#17263d" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="40" font-weight="700">AIを切り替えても、同じ「あおい」から始めるために</text>
  <text x="60" y="112" fill="#5b6b80" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="20">共通の判断と、今回の制作物を分けて保存し、両方のAIへ引き継ぎます。</text>

  <rect x="170" y="155" width="270" height="78" rx="18" fill="#17364a"/>
  <text x="305" y="205" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="30" font-weight="700">Claude</text>
  <rect x="760" y="155" width="270" height="78" rx="18" fill="#17364a"/>
  <text x="895" y="205" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="30" font-weight="700">Codex</text>

  <path d="M305 233 V275 H460" fill="none" stroke="#2d82a8" stroke-width="4"/>
  <path d="M895 233 V275 H740" fill="none" stroke="#2d82a8" stroke-width="4"/>
  <path d="M600 275 V315" fill="none" stroke="#2d82a8" stroke-width="4"/>
  <path d="M588 300 L600 316 L612 300" fill="#2d82a8"/>

  <rect x="65" y="320" width="520" height="360" rx="22" fill="#edf7fb" stroke="#9ecbde" stroke-width="2"/>
  <text x="95" y="370" fill="#17364a" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="29" font-weight="700">AOIフォルダ／</text>
  <text x="95" y="405" fill="#5b6b80" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="17">次の仕事でも使う判断やルール</text>

  <g fill="#263d50" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="20">
    <text x="105" y="455">├ 最初に読む.md</text>
    <text x="105" y="495">├ 人格と価値観.md</text>
    <text x="105" y="535">├ プロフィールと禁止事項.md</text>
    <text x="105" y="575">├ 媒体別の執筆ルール.md</text>
    <text x="105" y="615">├ 現在の方針と確認済み事実.md</text>
    <text x="105" y="655">└ 承認済み文章の見本.md</text>
  </g>

  <text x="600" y="505" text-anchor="middle" fill="#2d82a8" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="40" font-weight="700">＋</text>

  <rect x="615" y="320" width="520" height="360" rx="22" fill="#fffaf2" stroke="#e1ba8c" stroke-width="2"/>
  <text x="645" y="370" fill="#17364a" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="29" font-weight="700">今回の制作フォルダ／</text>
  <text x="645" y="405" fill="#5b6b80" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="17">この本や制作だけで使う実物と現在地</text>

  <g fill="#263d50" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="20">
    <text x="655" y="455">├ 原稿.md</text>
    <text x="655" y="495">├ 現在地.md</text>
    <text x="655" y="535">├ 検証データ／</text>
    <text x="655" y="575">├ 画像／</text>
    <text x="655" y="615">└ この制作だけのルール.md</text>
  </g>

  <rect x="155" y="720" width="890" height="64" rx="18" fill="#17364a"/>
  <text x="600" y="760" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="21" font-weight="700">作業開始：両方を読む　　作業終了：再利用できる学びだけ人間が確認して残す</text>
</svg>
